name: board_buddy
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.4.2+40

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^2.0.0
  gen_art_bg: ^0.5.1
  use_scramble: ^0.0.13
  shared_preferences: ^2.5.6
  intl: ^0.20.3
  url_launcher: ^6.3.3
  url_launcher_ios: ^6.4.2
  flutter_bloc: ^9.1.1
  flutter_popup: ^3.3.9
  wheel_chooser: ^1.1.2
  meta: ^1.19.0
  bloc: ^9.2.1
  sqflite: ^2.4.6
  path: ^1.9.1
  share_plus: ^13.3.1
  rate_my_app: ^2.4.2
  wakelock_plus: ^1.8.2
  gaimon: ^1.5.1
  talker: ^5.2.0
  talker_bloc_logger: ^5.2.0
  talker_flutter: ^5.2.0
  upgrader: ^14.0.0
  material_ui: ^1.11.1
  cupertino_ui: ^1.1.7
  not_static_icons: ^0.54.0
  motor: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  intl_translation: ^0.22.0
  build_runner: ^2.17.1
  sqflite_common_ffi: ^2.4.7

flutter_launcher_icons:
  android: "launcher_icon"
  image_path_ios: "assets/logo/logo.png"
  image_path_ios_dark_transparent: "assets/logo/logo-dark.png"
  remove_alpha_ios: true
  ios: true
  image_path: "assets/logo/logo.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  adaptive_icon_foreground: "assets/logo/logo.png"
  adaptive_icon_background: "#ffffff"

flutter:

  uses-material-design: true

  fonts:
  - family: RobotoMono
    fonts:
      - asset: assets/fonts/roboto_mono.ttf
        weight: 400
      - asset: assets/fonts/roboto_mono_thin.ttf
        weight: 300


flutter_intl:
  enabled: true
